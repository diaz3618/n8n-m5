; n8n Remote for M5Stack CoreS3 + Tab5
[platformio]
default_envs = cores3, tab5   ; add cores3-dev / tab5-dev for the serial dev console

[env]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.filesystem = littlefs
lib_deps =
    m5stack/M5Unified @ ^0.2.23
    m5stack/M5GFX     @ ^0.2.30
    bblanchon/ArduinoJson @ ^7.2.0
    lvgl/lvgl @ ^9.2.2
build_unflags = -Os
build_flags =
    -O2
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
extra_scripts = post:scripts/make_bins.py

; CoreS3 (ESP32-S3, 320x240)
[env:cores3]
board = m5stack-cores3
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DDEVICE_CORES3

; Tab5 (ESP32-P4 pre-rev3 "ES" silicon - NOT P4X - 1280x720)
; Tab5 Wi-Fi: the ESP32-C6 (ESP-Hosted slave 2.12.x over SDIO) needs a matching host. Arduino 3.3.12 ships host 2.12.13 and the C6's
; wifi_init is refused (INVALID_ARG, MAC 00:..:00); pioarduino 55.03.39 (Arduino 3.3.9, host 2.12.8 - what Launcher/Bruce use) works.
; Use a separate PlatformIO dir per Tab5 variant: ~/.platformio-n8n-tab5 (plain) and ~/.platformio-n8n-tab5-tls13 (SDK rebuild, see scripts/setup_tab5_core.sh)
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unit-KEYBOARD   ; Tab5 keyboard module (UnitTab5Keyboard)
build_flags = ${env.build_flags} -DDEVICE_TAB5

; Developer builds: add the serial dev console (src/fw/fw_dev.cpp). Not for release.
[env:cores3-dev]
extends = env:cores3
build_flags = ${env:cores3.build_flags} -DDEV_CONSOLE=1

[env:tab5-dev]
extends = env:tab5
build_flags = ${env:tab5.build_flags} -DDEV_CONSOLE=1

; TLS 1.3 variants: the SDK is rebuilt (pioarduino "custom_sdkconfig") with mbedTLS TLS 1.3 so servers that only accept
; TLS 1.3 (e.g. Cloudflare with "minimum TLS 1.3") work. The rebuild rewrites the SDK package in place, so build these with their
; own PlatformIO dir:  PLATFORMIO_CORE_DIR=$HOME/.platformio-n8n-tls13 pio run -e cores3-tls13
[tls13]
board_build.partitions = partitions_16MB.csv
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
    CONFIG_MBEDTLS_SSL_TLS1_3_COMPATIBILITY_MODE=y
    CONFIG_MBEDTLS_SSL_TLS1_3_KEXM_EPHEMERAL=y
    CONFIG_MBEDTLS_SSL_TLS1_3_KEXM_PSK=y
    CONFIG_MBEDTLS_CLIENT_SSL_SESSION_TICKETS=n
    CONFIG_LWIP_CHECK_THREAD_SAFETY=n
tls13_flags = -DHAS_TLS13=1

[env:cores3-tls13]
extends = env:cores3, tls13
build_flags = ${env:cores3.build_flags} ${tls13.tls13_flags}

[env:cores3-tls13-dev]
extends = env:cores3-dev, tls13
build_flags = ${env:cores3-dev.build_flags} ${tls13.tls13_flags}

; P4: ESP-IDF's RISC-V memcpy refuses size-optimized builds ("DIG-694"), so the rebuilt SDK uses -O2 there
[tls13_p4]
; the rebuild would fetch esp_hosted 2.12.13, which the C6's 2.12.6 slave answers with INVALID_ARG on wifi_init: seed the solver with the stock lock
extra_scripts = ${env.extra_scripts}
    pre:scripts/tab5_prebuild.py
custom_sdkconfig =
    ${tls13.custom_sdkconfig}
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    CONFIG_COMPILER_OPTIMIZATION_SIZE=n
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=12000
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768

[env:tab5-tls13]
extends = env:tab5, tls13, tls13_p4
build_flags = ${env:tab5.build_flags} ${tls13.tls13_flags}

[env:tab5-tls13-dev]
extends = env:tab5-dev, tls13, tls13_p4
build_flags = ${env:tab5-dev.build_flags} ${tls13.tls13_flags}
